info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/authors"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    type: json
    data: |-
      {
        "name":"Alejandro Dumas"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
