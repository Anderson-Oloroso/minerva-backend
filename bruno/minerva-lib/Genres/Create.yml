info:
  name: Create
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/genres"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    type: json
    data: |-
      {
          "genre": "Barroco"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
