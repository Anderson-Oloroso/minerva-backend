info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email":"admin@minerva.com",
        "password": "@Minerva_Lib/871"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (res.status === 200 && body?.accessToken) {
          bru.setEnvVar("accessToken", body.accessToken);
        } else {
          bru.setEnvVar("accessToken", "");
        }
