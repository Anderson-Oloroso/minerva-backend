services:
  db:
    image: mysql:8.0
    container_name: minerva_mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME:-minerva_lib_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secretpassword}
    ports:
      - "${DB_PUBLISHED_PORT:-3307}:${DB_PORT:-3306}"
    command: --port=${DB_PORT:-3306}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=TCP -h 127.0.0.1 --port=\"$${DB_PORT:-3306}\" -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: .
    container_name: minerva_backend
    restart: always
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  mysql_data:
